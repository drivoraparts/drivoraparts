name: Deploy OpenNext Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-worker
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: OpenNext Cloudflare Worker (production)
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies (deterministic)
        run: npm ci

      - name: Pre-build verification
        run: npm run verify:cloudflare

      - name: Build for Cloudflare (OpenNext)
        run: npm run pages:build

      - uses: actions/upload-artifact@v4
        with:
          name: open-next-build
          path: .open-next
          retention-days: 7
          include-hidden-files: true

      - name: Deploy Worker to Cloudflare
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: npm run pages:deploy

      - name: Ping search engines (sitemap)
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          SITEMAP="https://drivoraparts.com/sitemap.xml"
          curl -fsS "https://www.bing.com/ping?sitemap=${SITEMAP}" || true
          curl -fsS "https://www.google.com/ping?sitemap=${SITEMAP}" || true
          echo "Sitemap ping sent for ${SITEMAP}"

      - name: Wait for Cloudflare propagation
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: sleep 45

      - name: SEO verification (production)
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        continue-on-error: true
        run: npm run verify:seo
        env:
          SEO_SITE_URL: https://drivoraparts.com
          SEO_VERIFY_RETRIES: 8
          SEO_VERIFY_DELAY_MS: 20000
