name: Deploy OpenNext Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-worker
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: OpenNext Cloudflare Worker (production)
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies (deterministic)
        run: npm ci

      # A storefront-claims regression is invisible in a diff and reaches
      # customers as a contradiction -- a listing titled "Used ..." badged
      # Brand New, an engine-block description on a torque converter, a
      # homepage count that no longer matches the catalog it claims to
      # count. Placed before the build so a bad catalog fails in seconds
      # rather than after a four-minute bundle. A non-zero exit fails this
      # job, and every later step is then skipped -- including the deploy,
      # whose `if` names no status function and so carries the implicit
      # success() that GitHub applies by default.
      - name: Storefront claims audit
        run: npm run audit:storefront-claims

      - name: Pre-build verification
        run: npm run verify:cloudflare

      - name: Build for Cloudflare (OpenNext)
        run: npm run pages:build

      - uses: actions/upload-artifact@v7
        with:
          name: open-next-build
          path: .open-next
          retention-days: 7
          include-hidden-files: true

      - name: Deploy Worker to Cloudflare
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: npm run pages:deploy

      # The Worker's every-10-minutes cron (payment reconciliation and review
      # requests) does nothing without CRON_SECRET. Create it once if it is
      # missing: a random value generated here and piped straight to
      # Cloudflare, so it never appears in a log, the repository or a chat.
      # An existing secret is left exactly as it is.
      - name: Ensure CRON_SECRET is set on the Worker
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          if npx wrangler secret list --format json | grep -q '"CRON_SECRET"'; then
            echo "CRON_SECRET already set on the Worker; leaving it unchanged."
          else
            openssl rand -hex 32 | npx wrangler secret put CRON_SECRET
            echo "CRON_SECRET created on the Worker."
          fi

      - name: Ping search engines (sitemap)
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          SITEMAP="https://drivoraparts.com/sitemap.xml"
          curl -fsS "https://www.bing.com/ping?sitemap=${SITEMAP}" || true
          curl -fsS "https://www.google.com/ping?sitemap=${SITEMAP}" || true
          echo "Sitemap ping sent for ${SITEMAP}"

      - name: Wait for Cloudflare propagation
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: sleep 45

      - name: SEO verification (production)
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        continue-on-error: true
        run: npm run verify:seo
        env:
          SEO_SITE_URL: https://drivoraparts.com
          SEO_VERIFY_RETRIES: 8
          SEO_VERIFY_DELAY_MS: 20000
