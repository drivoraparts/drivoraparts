name: Reconcile Payments

# Optional safety net: reconciles stale pending NOWPayments orders via a secured HTTP endpoint.
# Requires CRON_SECRET in GitHub Actions secrets and on Cloudflare Production.

# The schedule now lives in wrangler.jsonc (triggers.crons) and runs inside the
# Worker itself. Two reasons it moved:
#
#   1. Cloudflare challenged this runner's IP, so the HTTP call never reached
#      the app — reconciliation had never actually run.
#   2. GitHub throttles scheduled workflows hard. A "*/10" cron here fired
#      between 1 and 12 hours apart in practice, which is not a safety net.
#
# Kept as a manual trigger: useful for reconciling on demand after an incident,
# and for confirming the endpoint still answers from outside.
on:
  workflow_dispatch:
    inputs:
      olderThanMinutes:
        description: "Only reconcile orders older than N minutes"
        required: false
        default: "10"

concurrency:
  group: reconcile-payments
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reconciliation endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          RECONCILE_URL: ${{ vars.RECONCILE_URL }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::notice::CRON_SECRET is not configured — skipping reconciliation (not a deploy failure)."
            exit 0
          fi
          URL="${RECONCILE_URL:-https://drivoraparts.com/api/payments/reconcile}"
          code=$(curl -sS -o /tmp/reconcile.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${URL}")
          echo "HTTP ${code}"
          cat /tmp/reconcile.json || true
          echo

          # A silent safety net is worse than none. This step used to exit 0 on
          # every non-200, so a permanently broken reconciliation showed a green
          # tick forever. Configuration faults now fail the job loudly; only
          # genuinely transient faults stay quiet.
          case "$code" in
            200)
              ;;
            401)
              echo "::error::CRON_SECRET rejected (HTTP 401) — the value in GitHub Actions does not match the one on Cloudflare."
              exit 1
              ;;
            403)
              echo "::error::Blocked before reaching the app (HTTP 403) — Cloudflare is challenging the GitHub runner. Add a WAF skip rule for /api/payments/reconcile."
              exit 1
              ;;
            5*)
              echo "::warning::Reconciliation returned HTTP ${code} — treating as transient."
              exit 0
              ;;
            *)
              echo "::error::Reconciliation returned unexpected HTTP ${code}."
              exit 1
              ;;
          esac
