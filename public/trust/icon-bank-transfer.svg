<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 32" width="48" height="32" role="img" aria-label="Bank transfer">
  <!--
    Generic bank/institution icon drawn for DrivoraParts. Deliberately NOT any
    real bank's logo or a recreation of one: a bank transfer is a route, not a
    brand, and putting a real institution's mark here would misrepresent a
    relationship that does not exist.

    Stroke colour is fixed rather than currentColor because this is loaded via
    <img>, which cannot inherit text colour. #e5e5e5 matches the neutral-200
    the surrounding footer type uses on its dark ground.
  -->
  <g fill="none" stroke="#e5e5e5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 13.5 24 5l18 8.5" />
    <path d="M9.5 13.5v12M17.5 13.5v12M30.5 13.5v12M38.5 13.5v12" />
    <path d="M5.5 26.5h37" />
  </g>
</svg>
